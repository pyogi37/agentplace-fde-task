# Render's free plan sleeps after 15 idle minutes and takes ~50 s to wake, long enough for the
# agent's call to time out. Backup for the cron-job.org ping (README, Deploy step 4): that one keeps
# the relay awake but can't wake it, while a request from here can. GitHub runs schedules late or not
# at all, so this only helps now and then.
name: keep-warm
on:
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.RELAY_URL != '' }}
    steps:
      - run: curl -fsS --retry 3 --max-time 90 "${{ vars.RELAY_URL }}/health"
