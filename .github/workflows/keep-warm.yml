# Render's free plan sleeps after 15 idle minutes and takes ~50 s to wake, long enough for the
# agent's call to time out. Pinging 02:00-18:00 UTC keeps it awake for most working hours while
# staying well inside the 750 free instance-hours a month shared by the workspace.
name: keep-warm
on:
  schedule: [{ cron: "*/10 2-17 * * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.RELAY_URL != '' }}
    steps:
      - run: curl -fsS --retry 3 --max-time 90 "${{ vars.RELAY_URL }}/health"
